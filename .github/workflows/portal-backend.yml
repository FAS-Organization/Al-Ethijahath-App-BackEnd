name: Portal backend checks
on:
  push:
    branches: [customer-portal-launch-review]
  pull_request:
    branches: [sjd-branch]
permissions:
  contents: read
jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: portal
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_DB: portal
      POSTGRES_USER: portal
      POSTGRES_PASSWORD: ci-test-only
      POSTGRES_HOST: 127.0.0.1
      SECRET_KEY: isolated-ci-key-for-portal-workflow-tests-only-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py configure_portal_roles
      - run: python manage.py collectstatic --noinput --verbosity 0
      - run: python manage.py test web
